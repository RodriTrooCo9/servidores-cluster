---
stages:
  - lint
  - syntax-check
  - dry-run

variables:
  ANSIBLE_FORCE_COLOR: "true"
  PY_COLORS: "1"

cli:regressions:
  stage: dry-run
  image: python:3.11-slim
  script:
    - python3 -m unittest discover -s tests -v

lint:yaml:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install yamllint
  script:
    - yamllint -c .yamllint .

lint:shell:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - find scripts/ network/ -name "*.sh" -exec shellcheck {} +

lint:ansible:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ansible ansible-lint
  script:
    - ansible-lint ansible/site.yml

syntax-check:
  stage: syntax-check
  image: python:3.11-slim
  before_script:
    - pip install ansible
    - mkdir -p ~/.ansible
    - touch .vault_pass
  script:
    - ansible-playbook -i inventory/lab/hosts.yml ansible/site.yml --syntax-check
