[defaults]
inventory               = inventory/hosts.yml
roles_path              = roles
remote_user             = debian
host_key_checking       = False
retry_files_enabled     = False
forks                   = 8
gathering               = smart
fact_caching            = memory
stdout_callback         = default
bin_ansible_callbacks   = True
deprecation_warnings    = False
interpreter_python      = auto_silent

# Llave de cifrado para contraseñas y tokens sensibles
# (Crear este archivo con: echo "tu_password_maestra" > .vault_pass && chmod 600 .vault_pass)
vault_password_file     = .vault_pass

[ssh_connection]
# Pipelining acelera las tareas x4 al ejecutar los scripts de Python en memoria
pipelining              = True

# Reutilización de conexiones SSH (ControlMaster / ControlPersist)
ssh_args                = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
