---
# ==============================================================================
# Playbook: 03_healthcheck.yml
# Objetivo: Auditoría de puertos y servicios esenciales en la flota
# ==============================================================================
- name: "Healthcheck Integral de Servicios en la Flota"
  hosts: baremetal
  tasks:
    - name: "Verificar disponibilidad del puerto Node Exporter (9100)"
      ansible.builtin.wait_for:
        port: 9100
        timeout: 3
        state: started
      ignore_errors: true
      register: exporter_check

    - name: "Reportar estado de métricas"
      ansible.builtin.debug:
        msg: "Node Exporter en {{ inventory_hostname }}: {{ 'ACTIVO (OK)' if exporter_check is not failed else 'NO DETECTADO' }}"

- name: "Verificar Servicios Centrales en Nodo 306 (PXE/Router)"
  hosts: pxe_controller
  tasks:
    - name: "Comprobar servicios críticos en Nodo 306"
      ansible.builtin.wait_for:
        port: "{{ item.port }}"
        timeout: 3
        state: started
      loop:
        - { name: "DNS/DHCP dnsmasq", port: 53 }
        - { name: "HTTPBoot Nginx", port: 8089 }
        - { name: "Prometheus TSDB", port: 9090 }
        - { name: "Grafana Web", port: 3000 }
      ignore_errors: true
      register: core_services

    - name: "Reportar estado de servicios en Nodo 306"
      ansible.builtin.debug:
        msg: "Servicio {{ item.item.name }} (Puerto {{ item.item.port }}): {{ 'ONLINE' if item is not failed else 'OFFLINE' }}"
      loop: "{{ core_services.results }}"

- name: "Verificar Nexus OSS en Nodo 315"
  hosts: nexus
  tasks:
    - name: "Comprobar puerto 8081 de Nexus"
      ansible.builtin.wait_for:
        port: 8081
        timeout: 3
        state: started
      ignore_errors: true
      register: nexus_status

    - name: "Reportar estado de Nexus"
      ansible.builtin.debug:
        msg: "Nexus 3 OSS (10.100.29.20:8081): {{ 'ONLINE' if nexus_status is not failed else 'OFFLINE' }}"
