---
- name: "Actualizar control planes RKE2 de uno en uno"
  hosts: k8s_control_plane
  serial: 1
  any_errors_fatal: true
  become: true
  roles:
    - rke2_ha

- name: "Actualizar workers tras los control planes"
  hosts: k8s_workers
  serial: 1
  any_errors_fatal: true
  become: true
  roles:
    - rke2_ha
