---
# ==============================================================================
# Playbook: 10_disaster_recovery.yml
# Objetivo: Procedimientos Automatizados de Recuperación ante Desastres (DR),
#           Respaldos (etcd / OpenStack) y Auto-Sanación del Clúster.
#
# Modos de Ejecución:
#   1. Auditoría de Salud para DR:
#      ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/10_disaster_recovery.yml --tags audit
#
#   2. Respaldo Integral (etcd + MariaDB OpenStack):
#      ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/10_disaster_recovery.yml --tags backup
#
#   3. Auto-Sanación de Quórum etcd (remover miembro caído):
#      ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/10_disaster_recovery.yml --tags heal_etcd -e "failed_ip=10.100.29.102"
#
#   4. Reincorporación Limpia de Nodo tras Recuperación por Ironic:
#      ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/10_disaster_recovery.yml --tags rejoin --limit nodo-280
# ==============================================================================

# ------------------------------------------------------------------------------
# PLAY 1: Auditoría de Estado y Quórum en Control Planes
# ------------------------------------------------------------------------------
- name: "DR: Auditoría de Salud del Quórum etcd y Estado de Nodos"
  hosts: k8s_control_plane
  become: true
  tags: [audit, status]
  tasks:
    - name: "Verificar si el socket de etcd responde en local"
      ansible.builtin.command:
        cmd: >
          /var/lib/rancher/rke2/bin/etcdctl
          --cacert=/var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
          --cert=/var/lib/rancher/rke2/server/tls/etcd/server-client.crt
          --key=/var/lib/rancher/rke2/server/tls/etcd/server-client.key
          endpoint health
      environment:
        ETCDCTL_API: "3"
      register: etcd_health
      failed_when: false
      changed_when: false

    - name: "Mostrar salud de etcd en cada nodo Control Plane"
      ansible.builtin.debug:
        msg: "Nodo {{ inventory_hostname }} ({{ ansible_host }}): {{ etcd_health.stdout | default('NO OPERATIVO / DOWN') }}"

    - name: "Consultar lista de miembros activos en el Líder"
      ansible.builtin.command:
        cmd: >
          /var/lib/rancher/rke2/bin/etcdctl
          --cacert=/var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
          --cert=/var/lib/rancher/rke2/server/tls/etcd/server-client.crt
          --key=/var/lib/rancher/rke2/server/tls/etcd/server-client.key
          member list -w table
      environment:
        ETCDCTL_API: "3"
      register: etcd_members
      when: k8s_leader | default(false)
      failed_when: false
      changed_when: false

    - name: "Tabla de miembros etcd del clúster"
      ansible.builtin.debug:
        var: etcd_members.stdout_lines
      when: k8s_leader | default(false) and etcd_members.stdout_lines is defined

# ------------------------------------------------------------------------------
# PLAY 2: Respaldos Automatizados de Recuperación ante Desastres
# ------------------------------------------------------------------------------
- name: "DR: Generar Snapshot de etcd en el Control Plane Líder"
  hosts: k8s_control_plane
  become: true
  tags: [backup, backup_etcd]
  tasks:
    - name: "Exigir un único líder configurado para el respaldo"
      ansible.builtin.assert:
        that:
          - >-
            groups['k8s_control_plane'] | map('extract', hostvars)
            | selectattr('k8s_leader', 'defined')
            | selectattr('k8s_leader', 'equalto', true) | list | length == 1
        fail_msg: "El inventario debe definir exactamente un control plane con k8s_leader: true."
      run_once: true

    - name: "Tomar Snapshot de etcd en el líder activo"
      when: k8s_leader | default(false)
      block:
        - name: "Crear directorio local de snapshots si no existe"
          ansible.builtin.file:
            path: /var/lib/rancher/rke2/server/db/snapshots
            state: directory
            mode: '0700'

        - name: "Ejecutar guardado de snapshot con RKE2 CLI"
          ansible.builtin.command:
            cmd: "/usr/local/bin/rke2 etcd-snapshot save --name dr-backup-{{ ansible_date_time.iso8601_basic_short }}"
          register: rke2_snap
          changed_when: true

        - name: "Localizar snapshot recién generado"
          ansible.builtin.find:
            paths: /var/lib/rancher/rke2/server/db/snapshots
            patterns: "dr-backup-{{ ansible_date_time.iso8601_basic_short }}*"
            file_type: file
          register: dr_snapshots

        - name: "Exigir al menos un snapshot no vacío"
          ansible.builtin.assert:
            that:
              - dr_snapshots.matched | int > 0
              - dr_snapshots.files | selectattr('size', 'equalto', 0) | list | length == 0

        - name: "Preparar directorio local privado de recuperación"
          ansible.builtin.file:
            path: "{{ playbook_dir }}/../../../backups/etcd/{{ inventory_hostname }}"
            state: directory
            mode: '0700'
          delegate_to: localhost
          become: false

        - name: "Copiar snapshots y token necesario para restaurarlos"
          ansible.builtin.fetch:
            src: "{{ item }}"
            dest: "{{ playbook_dir }}/../../../backups/etcd/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}/"
            flat: true
            validate_checksum: true
          loop: "{{ (dr_snapshots.files | map(attribute='path') | list) + ['/var/lib/rancher/rke2/server/token'] }}"
          no_log: true

- name: "DR: Generar Respaldo de Base de Datos MariaDB y Configs Kolla en PXE Controller"
  hosts: pxe_controller
  become: true
  tags: [backup, backup_openstack]
  tasks:
    - name: "Crear directorio para volcados de OpenStack en el Controller"
      ansible.builtin.file:
        path: /var/backups/openstack
        state: directory
        mode: '0750'

    - name: "Leer configuración de credenciales Kolla"
      ansible.builtin.slurp:
        src: /etc/kolla/passwords.yml
      register: dr_kolla_passwords
      no_log: true

    - name: "Validar contraseña de base de datos"
      ansible.builtin.assert:
        that:
          - (dr_kolla_passwords.content | b64decode | from_yaml).database_password | default('') | length > 0
      no_log: true

    - name: "Volcar MariaDB de forma atómica y propagar fallos"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          umask 077
          output=/var/backups/openstack/mariadb_dump_{{ ansible_date_time.iso8601_basic_short }}.sql.gz
          temporary=$(mktemp /var/backups/openstack/.dump.XXXXXX)
          trap 'rm -f "$temporary"' EXIT
          docker exec -e MYSQL_PWD mariadb mysqldump -u root --all-databases | gzip -c > "$temporary"
          gzip -t "$temporary"
          gzip -dc "$temporary" | wc -c | awk '$1 > 0 {ok=1} END {exit !ok}'
          mv "$temporary" "$output"
      environment:
        MYSQL_PWD: "{{ (dr_kolla_passwords.content | b64decode | from_yaml).database_password }}"
      changed_when: true
      no_log: true

    - name: "Empaquetar archivos de configuración /etc/kolla"
      community.general.archive:
        path: /etc/kolla
        dest: "/var/backups/openstack/kolla_etc_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        format: gz
        mode: '0600'

    - name: "Preparar directorio local privado para OpenStack"
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../../backups/openstack/{{ inventory_hostname }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: "Descargar respaldos OpenStack y validar su transferencia"
      ansible.builtin.fetch:
        src: "/var/backups/openstack/{{ item }}"
        dest: "{{ playbook_dir }}/../../../backups/openstack/{{ inventory_hostname }}/"
        flat: true
        validate_checksum: true
      loop:
        - "mariadb_dump_{{ ansible_date_time.iso8601_basic_short }}.sql.gz"
        - "kolla_etc_{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
      no_log: true

# ------------------------------------------------------------------------------
# PLAY 3: Auto-Sanación de Quórum etcd (Expulsión de Miembro Muerto)
# ------------------------------------------------------------------------------
- name: "DR: Eliminar Miembro Caído/Reemplazado de etcd para Proteger Quórum"
  hosts: k8s_control_plane
  become: true
  tags: [heal_etcd]
  tasks:
    - name: "Identificar y remover miembro con IP fallida"
      when:
        - k8s_leader | default(false)
        - failed_ip is defined and failed_ip != ""
      block:
        - name: "Localizar Member ID para la IP fallida ({{ failed_ip }})"
          ansible.builtin.shell:
            cmd: >
              /var/lib/rancher/rke2/bin/etcdctl
              --cacert=/var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
              --cert=/var/lib/rancher/rke2/server/tls/etcd/server-client.crt
              --key=/var/lib/rancher/rke2/server/tls/etcd/server-client.key
              member list | grep '{{ failed_ip }}' | awk -F',' '{print $1}'
          environment:
            ETCDCTL_API: "3"
          register: target_member_id
          changed_when: false

        - name: "Remover miembro caído de etcd si fue localizado"
          when: target_member_id.stdout != ""
          ansible.builtin.command:
            cmd: >
              /var/lib/rancher/rke2/bin/etcdctl
              --cacert=/var/lib/rancher/rke2/server/tls/etcd/server-ca.crt
              --cert=/var/lib/rancher/rke2/server/tls/etcd/server-client.crt
              --key=/var/lib/rancher/rke2/server/tls/etcd/server-client.key
              member remove {{ target_member_id.stdout }}
          environment:
            ETCDCTL_API: "3"
          register: member_remove_res

        - name: "Confirmación de remoción"
          ansible.builtin.debug:
            msg: "Miembro con IP {{ failed_ip }} (ID {{ target_member_id.stdout | default('N/A') }}) retirado del quórum exitosamente."

# ------------------------------------------------------------------------------
# PLAY 4: Reincorporación de Nodo Recuperado
# ------------------------------------------------------------------------------
- name: "DR: Reincorporación Limpia de Nodo Recuperado al Clúster"
  hosts: k8s_cluster
  serial: 1
  any_errors_fatal: true
  become: true
  tags: [rejoin]
  roles:
    - common
    - rke2_ha
## recuperar el nodo con Ironic y luego ejecutar este playbook para reincorporarlo al clúster / recuperacion rapida
