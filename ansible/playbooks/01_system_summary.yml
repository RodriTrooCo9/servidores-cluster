---
# ==============================================================================
# Playbook: 01_system_summary.yml
# Objetivo: Recopilar telemetría de hardware, kernel, RAM y disco en paralelo
# ==============================================================================
- name: "Auditoría de Hardware y Sistema Operativo"
  hosts: baremetal
  gather_facts: true
  tasks:
    - name: "Calcular métricas de memoria y almacenamiento"
      ansible.builtin.set_fact:
        ram_total_gb: "{{ (ansible_memtotal_mb / 1024) | round(1) }}"
        ram_free_gb: "{{ (ansible_memfree_mb / 1024) | round(1) }}"
        disk_root_avail_gb: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first / 1024 / 1024 / 1024) | round(1) }}"

    - name: "Resumen de telemetría por nodo"
      ansible.builtin.debug:
        msg: >-
          [{{ inventory_hostname }} / ID: {{ node_id }}]
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }} |
          Kernel: {{ ansible_kernel }} |
          CPU: {{ ansible_processor_vcpus }} vCPUs ({{ ansible_processor[1] | default('x86_64') }}) |
          RAM: {{ ram_free_gb }} GB libres de {{ ram_total_gb }} GB |
          Disco Root Disponible: {{ disk_root_avail_gb }} GB
