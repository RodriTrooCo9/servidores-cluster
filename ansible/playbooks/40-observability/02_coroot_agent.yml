---
# ==============================================================================
# Playbook: 02_coroot_agent.yml
# Objetivo: Desplegar el agente eBPF de Coroot en toda la flota física
# Invoca: Rol 'coroot_node_agent'
# Excluye: pxe_controller (Nodo 306 ya ejecuta el agente integrado en Docker Compose)
# ==============================================================================
- name: "Despliegue del Agente Coroot eBPF en Nodos Bare-Metal"
  hosts: "baremetal:!pxe_controller"
  become: true
  roles:
    - coroot_node_agent
