# ==============================================================================
# Overrides para OpenStack Ironic Conductor y API
# ==============================================================================

[DEFAULT]
enabled_hardware_types = staging-wol,manual-management,ipmi,redfish
enabled_power_interfaces = staging-wol,ipmitool,redfish,fake
enabled_management_interfaces = noop,ipmitool,redfish,fake
enabled_deploy_interfaces = direct,ramdisk
enabled_boot_interfaces = ipxe,pxe
default_boot_interface = ipxe
default_deploy_interface = direct

[conductor]
# Desactivar cleaning destructivo automático en nodos físicos Dell sin IPMI
automated_clean = false

[deploy]
# Arrancar desde el disco local NVMe tras el aprovisionamiento
default_boot_option = local
