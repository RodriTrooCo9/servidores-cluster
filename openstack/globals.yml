---
# ==============================================================================
# ARCHIVO DE CONFIGURACIÓN MAESTRO: KOLLA-ANSIBLE
# OpenStack Release: 2025.1 (Epoxy)
# Entorno: Dell OptiPlex 3020M Bare-Metal Cluster (Single-NIC enp2s0)
# Controlador: nodo-306 (10.100.29.30 / 192.168.29.25)
# Registro: Sonatype Nexus 3 OSS (10.100.29.20:8082 / 8083)
# ==============================================================================

# Dummy variable para compatibilidad con Ansible
workaround_ansible_issue_8743: yes

# ------------------------------------------------------------------------------
# 1. DISTRIBUCIÓN BASE Y RELEASE DE OPENSTACK
# ------------------------------------------------------------------------------
# Distribución base para las imágenes de contenedores.
# 'ubuntu' (noble / 24.04 LTS) es la base estándar de mayor estabilidad y soporte.
kolla_base_distro: "ubuntu"
kolla_base_distro_version: "noble"

# Versión oficial de OpenStack: 2025.1 (Epoxy)
openstack_release: "2025.1"
openstack_tag: "2025.1-ubuntu-noble"
kolla_install_type: "source"

# Directorio de overrides de configuración por servicio (ironic.conf, glance-api.conf)
node_custom_config: "/home/rodrigo/Documents/gitlabinf/GuiaImplementacion/infra-scripts/kolla/config"

# ------------------------------------------------------------------------------
# 2. REGISTRO DE CONTENEDORES (SONATYPE NEXUS & QUAY.IO)
# ------------------------------------------------------------------------------
# El registro local Nexus OSS corre en nodo-315.
# - Puerto 8082: Repositorio Docker Group / Proxy (apunta a https://quay.io)
# - Puerto 8083: Repositorio Docker Hosted (almacenamiento local)
# En caso de estar el switch desconectado, puede sobreescribirse temporalmente a quay.io.
docker_registry: "10.100.29.20:8082"
docker_registry_insecure: "yes"
docker_namespace: "openstack.kolla"

# ------------------------------------------------------------------------------
# 3. TOPOLOGÍA DE RED Y VIRTUAL IP (VIP)
# ------------------------------------------------------------------------------
# Interfaz de red física en nodo-306 para gestión interna y comunicación de APIs
network_interface: "enp2s0"

# VIP interna de Kolla (HAProxy / Keepalived) para endpoints de Keystone y APIs.
# 10.100.29.5 está libre y fuera del rango DHCP (.50-.99)
kolla_internal_vip_address: "10.100.29.5"

# Interfaz externa de Neutron:
# REGLA CRÍTICA DE SEGURIDAD PARA HARDWARE DE 1 SOLA NIC (Dell OptiPlex 3020M):
# NO asignar directamente a 'enp2s0' porque OVS/OVN secuestra la NIC física y rompe SSH/IP.
# Se usa un par veth virtual 'veth-neutron' dedicado al puente br-ex.
neutron_external_interface: "veth-neutron"
neutron_plugin_agent: "ovn"

# ------------------------------------------------------------------------------
# 4. HABILITACIÓN DE SERVICIOS CORE
# ------------------------------------------------------------------------------
# Servicios esenciales solicitados
enable_keystone: "yes"
enable_glance: "yes"
enable_ironic: "yes"
enable_ironic_neutron_agent: "yes"
enable_neutron: "yes"
enable_nova: "yes"
enable_horizon: "yes"

# Alta disponibilidad y balanceo
enable_haproxy: "yes"
enable_keepalived: "yes"
enable_mariadb: "yes"
enable_rabbitmq: "yes"

# Optimización de recursos (16 GB RAM en nodo-306):
# Deshabilitar servicios secundarios no requeridos para Ironic y Glance
enable_cinder: "no"
enable_heat: "no"
enable_swift: "no"
enable_barbican: "no"
enable_aodh: "no"
enable_ceilometer: "no"
enable_openvswitch: "yes"
enable_ovn: "yes"

# ------------------------------------------------------------------------------
# 5. CONFIGURACIÓN DE GLANCE (CATÁLOGO DE IMÁGENES)
# ------------------------------------------------------------------------------
# Almacenamiento local en disco (file backend)
glance_backend_file: "yes"
glance_enable_property_protection: "no"

# ------------------------------------------------------------------------------
# 6. CONFIGURACIÓN DE IRONIC (PROVISIONAMIENTO BARE-METAL)
# ------------------------------------------------------------------------------
# Interfaz y rango DHCP servido por dnsmasq embebido de Ironic
ironic_dnsmasq_interface: "enp2s0"
ironic_dnsmasq_dhcp_ranges:
  - range: "10.100.29.150,10.100.29.199"

# Red de Neutron designada para cleaning y aprovisionamiento
ironic_cleaning_network: "public1"

# Drivers y tipos de hardware compatibles con Dell OptiPlex 3020M:
# Wake-on-LAN (wol) para encendido, manual-management para operaciones sin IPMI,
# e ipmi/redfish como placeholders estándar.
ironic_enabled_hardware_types: "staging-wol,manual-management,ipmi,redfish"
ironic_enabled_power_interfaces: "staging-wol,ipmitool,redfish,fake"
ironic_enabled_management_interfaces: "noop,ipmitool,redfish,fake"
ironic_enabled_deploy_interfaces: "direct,ramdisk"
ironic_enabled_boot_interfaces: "ipxe,pxe"

# Desactivar cleaning automatizado destructivo en nodos sin BMC out-of-band
ironic_automated_clean: "false"

# ------------------------------------------------------------------------------
# 7. PARÁMETROS GENERALES DEL CLÚSTER
# ------------------------------------------------------------------------------
openstack_region_name: "RegionOne"
kolla_enable_tls_internal: "no"
kolla_enable_tls_external: "no"
