apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: prueba-distribuida
  namespace: pruebas-carga
spec:
  parallelism: 3
  separate: true
  arguments: "-o experimental-prometheus-rw --tag testid=prueba-k8s-rke2"
  script:
    configMap:
      name: k6-script
      file: prueba.js
  runner:
    image: grafana/k6:latest
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
    env:
      - name: BASE_URL
        value: "http://backend-api.aplicaciones.svc.cluster.local:8000/api/v1/data"
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "http://victoriametrics.observability.svc.cluster.local:8428/api/v1/write"
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(90),p(95),p(99),min,max,avg"
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
