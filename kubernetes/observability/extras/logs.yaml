apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  namespace: observability
spec:
  serviceName: victoria-logs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
    spec:
      automountServiceAccountToken: false
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          args:
            - -storageDataPath=/data
            - -retentionPeriod=7d
            - -retention.maxDiskSpaceUsageBytes=4GiB
          ports:
            - containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: logs
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: logs
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: application-log-collector
  namespace: observability
data:
  collector.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/aplicaciones_*/*/*.log]
        start_at: end
        include_file_path: true
        storage: file_storage
        operators:
          - type: container
          - type: copy
            from: resource["k8s.container.name"]
            to: resource["service.name"]
            if: 'resource["k8s.container.name"] != nil'
    extensions:
      file_storage:
        directory: /var/lib/application-log-collector
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
      batch: {}
    exporters:
      otlphttp/loki:
        logs_endpoint: http://loki.observability.svc.cluster.local:3100/otlp/v1/logs
      otlphttp/victorialogs:
        logs_endpoint: http://victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki, otlphttp/victorialogs]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: application-log-collector
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: application-log-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-log-collector
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.104.0
          args: [--config=/conf/collector.yaml]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: checkpoints
              mountPath: /var/lib/application-log-collector
      volumes:
        - name: config
          configMap:
            name: application-log-collector
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: checkpoints
          hostPath:
            path: /var/lib/application-log-collector
            type: DirectoryOrCreate
