# ==============================================================================
# MANIFIESTO KUBERNETES: AGENTE DE TELEMETRÍA (OPENTELEMETRY DAEMONSET)
# Recolecta métricas de kubelet, logs de contenedores y trazas locales.
# Exporta:
#   - Logs -> Loki (10.100.29.101:30100)
#   - Métricas -> VictoriaMetrics / Prometheus (10.100.29.101:30428)
#   - Trazas -> Tempo / OTel Gateway (10.100.29.101:30317)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-node-agent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-node-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/stats", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-node-agent
subjects:
  - kind: ServiceAccount
    name: otel-node-agent
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-node-agent-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/monitoring_*/*/*.log
        start_at: beginning

      kubeletstats:
        collection_interval: 15s
        auth_type: "serviceAccount"
        endpoint: "https://127.0.0.1:10250"
        insecure_skip_verify: true
        metric_groups:
          - container
          - pod
          - node

    processors:
      batch:
        send_batch_size: 512
        timeout: 1s

      resource:
        attributes:
          - action: insert
            key: cluster
            value: "k8s-baremetal"
          - action: insert
            key: k8s.node.name
            from_attribute: "k8s.node.name"

    exporters:
      loki:
        endpoint: "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        tls:
          insecure: true

      prometheusremotewrite:
        endpoint: "http://victoriametrics.observability.svc.cluster.local:8428/api/v1/write"
        tls:
          insecure: true

      otlp/gateway:
        endpoint: "tempo.observability.svc.cluster.local:4317"
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [resource, batch]
          exporters: [loki]
        metrics:
          receivers: [kubeletstats, otlp]
          processors: [resource, batch]
          exporters: [prometheusremotewrite]
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/gateway]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-agent
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: otel-node-agent
  template:
    metadata:
      labels:
        app: otel-node-agent
    spec:
      serviceAccountName: otel-node-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: "Exists"
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.104.0
          imagePullPolicy: IfNotPresent
          command: ["/otelcol-contrib", "--config=/etc/otelcol/config.yaml"]
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-node-agent-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
