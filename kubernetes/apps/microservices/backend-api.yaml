---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: aplicaciones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
      annotations:
        instrumentation.opentelemetry.io/inject-python: "observability/auto-instrumentation"
    spec:
      containers:
        - name: api
          image: python:3.11-slim
          command:
            - python3
            - -c
            - |
              import http.server
              import json

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      known = self.path in ('/health', '/api/v1/data')
                      body = json.dumps({'status': 'ok', 'service': 'backend-api'} if known
                                        else {'error': 'not found'}).encode()
                      self.send_response(200 if known else 404)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              http.server.ThreadingHTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: aplicaciones
spec:
  selector:
    app: backend-api
  ports:
    - name: http
      port: 8000
      targetPort: http
