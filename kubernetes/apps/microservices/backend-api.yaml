---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: aplicaciones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
      annotations:
        instrumentation.opentelemetry.io/inject-python: "observability/auto-instrumentation"
    spec:
      containers:
        - name: api
          image: python:3.11-slim
          command:
            - python3
            - -c
            - |
              import http.server
              import json
              import logging

              from opentelemetry import trace
              from opentelemetry.propagate import extract
              from opentelemetry.trace import SpanKind, Status, StatusCode

              tracer = trace.get_tracer(__name__)
              logger = logging.getLogger("backend-api")
              logging.basicConfig(level=logging.INFO)

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      path = self.path
                      if path == '/health':
                          self.reply(True)
                          return

                      known = path == '/api/v1/data'
                      route = path if known else 'unmatched'
                      with tracer.start_as_current_span(
                          f"GET {route}",
                          context=extract({name.lower(): value for name, value in self.headers.items()}),
                          kind=SpanKind.SERVER,
                          attributes={"http.request.method": "GET"},
                      ) as span:
                          if known:
                              span.set_attribute("http.route", route)
                          span.set_attribute("http.response.status_code", 200 if known else 404)
                          try:
                              self.reply(known)
                          except Exception:
                              span.set_status(Status(StatusCode.ERROR))
                              raise
                          span_context = span.get_span_context()
                          if span_context.is_valid and span_context.trace_flags.sampled:
                              logger.info("GET %s status=%s trace_id=%032x",
                                          route, 200 if known else 404, span_context.trace_id)

                  def reply(self, known):
                      body = json.dumps({'status': 'ok', 'service': 'backend-api'} if known
                                        else {'error': 'not found'}).encode()
                      self.send_response(200 if known else 404)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              http.server.ThreadingHTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: aplicaciones
spec:
  type: NodePort
  selector:
    app: backend-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
